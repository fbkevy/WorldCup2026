name: Update odds

# RETIRED 2026-08-06: the World Cup is over, so the automation is discontinued.
# The schedule/cron and the self-re-arm step have been removed so this workflow
# never runs on its own again. It's left here (manual-dispatch only) for archive
# reference; to fully revive it you'd restore the `schedule:` trigger and the
# "Re-arm the next run" step below.

on:
  workflow_dispatch: {}     # manual only — no schedule, no self-re-arm

permissions:
  contents: write

concurrency:
  group: update-odds       # at most one running + one pending; no pile-ups
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll results + odds (every 5 min for ~55 min)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          for i in $(seq 1 11); do
            echo "--- iteration $i ($(date -u '+%H:%M UTC')) ---"
            python scripts/fetch_odds.py || true
            if ! git diff --quiet -- data/; then
              git add data/state.json data/history.json
              git commit -m "Update odds ($(date -u '+%Y-%m-%d %H:%M UTC'))"
              git pull --rebase --autostash origin main || true
              git push || true
            fi
            if [ "$i" -lt 11 ]; then sleep 300; fi
          done
